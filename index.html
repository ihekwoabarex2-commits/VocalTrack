<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VocalTrack - Live Studio Line Distribution</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-main: #0f172a;
            --bg-card: #1e293b;
            --bg-input: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #6366f1;
            --accent-hover: #4f46e5;
            --danger: #ef4444;
            --danger-hover: #dc2626;
            --success: #10b981;
            --border: #475569;
            --radius: 12px;
            --transition: all 0.25s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            line-height: 1.6;
            padding: 2rem 1rem;
            min-height: 100vh;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 2rem;
        }

        header h1 {
            font-size: 2.5rem;
            font-weight: 700;
            background: linear-gradient(135deg, #a5b4fc, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 0.5rem;
        }

        header p {
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 2rem;
        }

        @media (min-width: 992px) {
            .grid {
                grid-template-columns: 1.1fr 0.9fr;
            }
        }

        .card {
            background-color: var(--bg-card);
            border-radius: var(--radius);
            padding: 2rem;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.05);
            height: fit-content;
        }

        .card-title {
            font-size: 1.4rem;
            font-weight: 600;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--border);
            padding-bottom: 0.75rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .form-inline {
            display: flex;
            gap: 0.75rem;
            margin-bottom: 1.5rem;
        }

        input[type="text"], input[type="number"] {
            background-color: var(--bg-input);
            border: 1px solid var(--border);
            color: var(--text-main);
            padding: 0.75rem 1rem;
            border-radius: var(--radius);
            font-family: inherit;
            font-size: 1rem;
            outline: none;
            transition: var(--transition);
        }

        input[type="text"] {
            flex: 1;
        }

        input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        button {
            cursor: pointer;
            padding: 0.75rem 1.25rem;
            border-radius: var(--radius);
            font-family: inherit;
            font-size: 1rem;
            font-weight: 500;
            border: none;
            transition: var(--transition);
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            user-select: none;
        }

        .btn-primary { background-color: var(--accent); color: white; }
        .btn-primary:hover { background-color: var(--accent-hover); }
        .btn-danger { background-color: transparent; color: var(--danger); border: 1px solid rgba(239, 68, 68, 0.3); padding: 0.5rem; }
        .btn-danger:hover { background-color: var(--danger); color: white; }
        
        .btn-success { background-color: var(--success); color: white; }
        .btn-secondary { background-color: var(--bg-input); color: var(--text-main); border: 1px solid var(--border); }
        .btn-secondary:hover { background-color: var(--border); }

        /* Studio Controls Bar */
        .studio-controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 1.5rem;
            background: rgba(255,255,255,0.02);
            padding: 1rem;
            border-radius: var(--radius);
            border: 1px dashed var(--border);
        }

        /* Interactive Singing Buttons */
        .member-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .member-row {
            display: flex;
            align-items: center;
            gap: 1rem;
            background-color: rgba(255, 255, 255, 0.02);
            padding: 1rem;
            border-radius: var(--radius);
            border: 2px solid transparent;
            cursor: pointer;
            transition: all 0.15s ease-in-out;
            user-select: none;
        }

        .member-row:hover {
            background-color: rgba(255, 255, 255, 0.05);
            transform: translateY(-2px);
        }

        /* Highlight when tracking/singing active */
        .member-row.is-singing {
            background-color: rgba(99, 102, 241, 0.15);
            animation: pulse-border 1.5s infinite;
        }

        @keyframes pulse-border {
            0% { border-color: rgba(99, 102, 241, 0.4); }
            50% { border-color: rgba(99, 102, 241, 1); }
            100% { border-color: rgba(99, 102, 241, 0.4); }
        }

        .color-dot {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            flex-shrink: 0;
            box-shadow: 0 0 8px currentColor;
        }

        .member-name {
            flex: 1;
            font-weight: 600;
            font-size: 1.1rem;
        }

        .live-badge {
            background: var(--danger);
            color: white;
            font-size: 0.75rem;
            padding: 2px 6px;
            border-radius: 4px;
            font-weight: 700;
            display: none;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .member-row.is-singing .live-badge {
            display: inline-block;
        }

        .input-seconds {
            width: 80px;
            text-align: right;
        }

        /* Stats & Analytics */
        .stats-summary {
            display: flex;
            justify-content: space-between;
            margin-bottom: 1.5rem;
            background-color: rgba(255, 255, 255, 0.03);
            padding: 1rem;
            border-radius: var(--radius);
        }

        .stat-item .label { font-size: 0.85rem; color: var(--text-muted); text-transform: uppercase; }
        .stat-item .value { font-size: 1.25rem; font-weight: 600; }

        .distribution-bar {
            height: 35px;
            width: 100%;
            border-radius: 20px;
            overflow: hidden;
            display: flex;
            background-color: var(--bg-input);
            margin-bottom: 2rem;
        }

        .bar-segment {
            height: 100%;
            transition: width 0.1s linear;
            position: relative;
        }

        /* Leaderboard */
        .leaderboard { display: flex; flex-direction: column; gap: 0.75rem; }
        .leaderboard-row {
            display: flex;
            align-items: center;
            padding: 0.75rem 1rem;
            border-radius: var(--radius);
            background-color: rgba(255, 255, 255, 0.02);
            border-left: 4px solid transparent;
        }
        .leaderboard-rank { font-weight: 700; width: 30px; color: var(--text-muted); }
        .leaderboard-row:nth-child(1) .leaderboard-rank { color: #ffd700; }
        .leaderboard-row:nth-child(2) .leaderboard-rank { color: #c0c0c0; }
        .leaderboard-row:nth-child(3) .leaderboard-rank { color: #cd7f32; }
        .leaderboard-name { flex: 1; font-weight: 500; }
        .leaderboard-data { text-align: right; }
        .leaderboard-pct { font-weight: 600; font-size: 1.05rem; }
        .leaderboard-sec { font-size: 0.85rem; color: var(--text-muted); }
        .empty-state { text-align: center; color: var(--text-muted); padding: 3rem 0; }
        footer { text-align: center; margin-top: 4rem; color: var(--text-muted); font-size: 0.9rem; }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>VocalTrack</h1>
            <p>Click members in real time as they sing to log distribution lines</p>
        </header>

        <div class="grid">
            <!-- Left Side: Interactive Live Studio Tracker -->
            <div class="card">
                <div class="card-title">Live Studio Deck</div>
                
                <div class="studio-controls">
                    <button id="btn-studio" class="btn-success">
                        <svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                        Start Live Tracking
                    </button>
                    <button id="btn-clear" class="btn-secondary">Reset Times</button>
                </div>

                <form class="form-inline" id="add-member-form">
                    <input type="text" id="member-name-input" placeholder="New member name..." required autocomplete="off">
                    <button type="submit" class="btn-primary">Add</button>
                </form>

                <div class="member-list" id="member-list-container">
                    <!-- Target clickable cards populate here dynamically -->
                </div>
            </div>

            <!-- Right Side: Real-time Analytics Visualizer -->
            <div class="card">
                <div class="card-title">Live Analytics</div>

                <div id="results-view">
                    <div class="stats-summary">
                        <div class="stat-item">
                            <div class="label">Song Duration</div>
                            <div class="value" id="stat-duration">0.0s</div>
                        </div>
                        <div class="stat-item">
                            <div class="label">Active Vocalist</div>
                            <div class="value" id="stat-active" style="color: var(--accent);">None</div>
                        </div>
                    </div>

                    <div class="distribution-bar" id="distribution-bar-visual"></div>
                    <div class="leaderboard" id="leaderboard-container"></div>
                </div>

                <div id="empty-view" class="empty-state" style="display:none;">
                    <p>Add group members to start calculating live vocal feeds.</p>
                </div>
            </div>
        </div>

        <footer>
            <p>&copy; 2026 VocalTrack Live Deck.</p>
        </footer>
    </div>

    <script>
        const colors = ['#6366f1', '#10b981', '#f59e0b', '#ec4899', '#06b6d4', '#8b5cf6', '#f43f5e', '#14b8a6', '#3b82f6', '#eab308'];

        // App State
        let members = [
            { id: '1', name: 'Winter', seconds: 0, color: colors[0] },
            { id: '2', name: 'Ningning', seconds: 0, color: colors[1] },
            { id: '3', name: 'Karina', seconds: 0, color: colors[2] },
            { id: '4', name: 'Giselle', seconds: 0, color: colors[3] }
        ];

        let isTracking = false;
        let activeMemberId = null;
        let trackingInterval = null;
        let lastUpdateTime = null;

        // DOM Elements
        const memberListContainer = document.getElementById('member-list-container');
        const distributionBar = document.getElementById('distribution-bar-visual');
        const leaderboardContainer = document.getElementById('leaderboard-container');
        const statDuration = document.getElementById('stat-duration');
        const statActive = document.getElementById('stat-active');
        const btnStudio = document.getElementById('btn-studio');
        const btnClear = document.getElementById('btn-clear');
        const form = document.getElementById('add-member-form');
        const nameInput = document.getElementById('member-name-input');

        function initUI() {
            renderMemberCards();
            updateAnalytics();
        }

        // Render input/clicking elements on the deck
        function renderMemberCards() {
            memberListContainer.innerHTML = '';
            members.forEach(member => {
                const row = document.createElement('div');
                row.className = `member-row ${activeMemberId === member.id ? 'is-singing' : ''}`;
                row.setAttribute('data-id', member.id);
                row.style.boxShadow = activeMemberId === member.id ? `0 0 15px ${member.color}33` : '';
                
                row.innerHTML = `
                    <div class="color-dot" style="background-color: ${member.color}; color: ${member.color}"></div>
                    <div class="member-name">
                        ${escapeHTML(member.name)}
                        <span class="live-badge">Singing</span>
                    </div>
                    <input type="number" class="input-seconds" min="0" step="0.1" value="${member.seconds.toFixed(1)}" data-id="${member.id}">
                    <button class="btn-danger" data-id="${member.id}">&times;</button>
                `;
                memberListContainer.appendChild(row);
            });
        }

        // Fast path for chart updates to prevent form input redraw lag
        function updateAnalytics() {
            const totalSeconds = members.reduce((sum, m) => sum + m.seconds, 0);
            statDuration.textContent = `${totalSeconds.toFixed(1)}s`;
            
            const activeMember = members.find(m => m.id === activeMemberId);
            statActive.textContent = activeMember ? activeMember.name : "None";
            statActive.style.color = activeMember ? activeMember.color : "var(--accent)";

            // Update visual stack bar
            distributionBar.innerHTML = '';
            members.forEach(member => {
                const pct = totalSeconds > 0 ? (member.seconds / totalSeconds) * 100 : 0;
                if (pct > 0) {
                    const segment = document.createElement('div');
                    segment.className = 'bar-segment';
                    segment.style.width = `${pct}%`;
                    segment.style.backgroundColor = member.color;
                    distributionBar.appendChild(segment);
                }
            });

            // Update Leaderboard
            const sortedMembers = [...members].sort((a, b) => b.seconds - a.seconds);
            leaderboardContainer.innerHTML = '';
            sortedMembers.forEach((member, index) => {
                const pct = totalSeconds > 0 ? (member.seconds / totalSeconds) * 100 : 0;
                const leadRow = document.createElement('div');
                leadRow.className = 'leaderboard-row';
                leadRow.style.borderLeftColor = member.color;
                leadRow.innerHTML = `
                    <div class="leaderboard-rank">#${index + 1}</div>
                    <div class="leaderboard-name">${escapeHTML(member.name)}</div>
                    <div class="leaderboard-data">
                        <div class="leaderboard-pct">${pct.toFixed(1)}%</div>
                        <div class="leaderboard-sec">${member.seconds.toFixed(1)}s</div>
                    </div>
                `;
                leaderboardContainer.appendChild(leadRow);
            });
        }

        // Toggle Live Studio Recording Mode
        btnStudio.addEventListener('click', () => {
            isTracking = !isTracking;
            if (isTracking) {
                btnStudio.innerHTML = `<svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h4z"/></svg> Pause Tracking`;
                btnStudio.className = "btn-secondary";
                lastUpdateTime = Date.now();
                startClock();
            } else {
                stopClock();
                activeMemberId = null;
                btnStudio.innerHTML = `<svg width="20" height="20" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg> Start Live Tracking`;
                btnStudio.className = "btn-success";
                renderMemberCards();
            }
        });

        function startClock() {
            trackingInterval = setInterval(() => {
                const now = Date.now();
                const delta = (now - lastUpdateTime) / 1000;
                lastUpdateTime = now;

                if (activeMemberId) {
                    const target = members.find(m => m.id === activeMemberId);
                    if (target) {
                        target.seconds += delta;
                        // update raw input elements values directly without rebuilding DOM layout tree
                        const inputField = document.querySelector(`input[data-id="${target.id}"]`);
                        if (inputField) inputField.value = target.seconds.toFixed(1);
                        updateAnalytics();
                    }
                }
            }, 100);
        }

        function stopClock() {
            clearInterval(trackingInterval);
        }

        // Handle deck card clicking logic
        memberListContainer.addEventListener('click', (e) => {
            const row = e.target.closest('.member-row');
            const deleteBtn = e.target.closest('.btn-danger');

            if (deleteBtn) {
                e.stopPropagation();
                const id = deleteBtn.getAttribute('data-id');
                if(activeMemberId === id) activeMemberId = null;
                members = members.filter(m => m.id !== id);
                initUI();
                return;
            }

            if (row && isTracking) {
                const targetId = row.getAttribute('data-id');
                // If clicking same active member, pause their flow. If clicking new member, swap active spotlight.
                activeMemberId = (activeMemberId === targetId) ? null : targetId;
                lastUpdateTime = Date.now();
                renderMemberCards();
            }
        });

        // Track manual changes made to the numbers fields
        memberListContainer.addEventListener('input', (e) => {
            if (e.target.classList.contains('input-seconds')) {
                const id = e.target.getAttribute('data-id');
                const val = parseFloat(e.target.value) || 0;
                const member = members.find(m => m.id === id);
                if (member) {
                    member.seconds = Math.max(0, val);
                    updateAnalytics();
                }
            }
        });

        // Add Member Form
        form.addEventListener('submit', (e) => {
            e.preventDefault();
            const name = nameInput.value.trim();
            if (!name) return;

            members.push({
                id: Date.now().toString(),
                name: name,
                seconds: 0,
                color: colors[members.length % colors.length]
            });
            nameInput.value = '';
            initUI();
        });

        // Reset Tracker
        btnClear.addEventListener('click', () => {
            members.forEach(m => m.seconds = 0);
            if(!isTracking) activeMemberId = null;
            initUI();
        });

        function escapeHTML(str) {
            return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
        }

        initUI();
    </script>
</body>
</html>
